<style>
    /* You may change ANYTHING: font-size, line-height, padding, margins, etc. */
    .text-block {
      font-size: 32px;
      line-height: 1.5;
      padding: 40px;
      position: relative;
      margin:15px;
    
      /* This variable locks to the font baseline visually */
      --baseline-offset: calc(1em + (text-underline-offset + text-decoration-thickness));
    }
    
    /* Main horizontal line aligned to baseline */
    .text-baseline-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 5px;
      background: black;
    
      /* Anchor to exact same offset from text top */
      top: var(--baseline-offset);
    }
    
    /* Words */
    .word {
      position: relative;
      cursor: pointer;
      white-space: pre;
    }
    
    /* On hover we draw an underline positioned by baseline offset */
    .word:hover::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 5px;
      background: red;
    
      /* EXACT SAME BASELINE POSITION AS GLOBAL LINE */
      top: var(--baseline-offset);
    }
    </style>
    
    
    <div class="text-block">
      <div class="text-baseline-line"></div>
      <span class="word">This</span>
      <span class="word">is</span>
      <span class="word">a</span>
      <span class="word">perfectly</span>
      <span class="word">aligned</span>
      <span class="word">example.</span>
    </div>
